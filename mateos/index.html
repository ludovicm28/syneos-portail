<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08192d">
  <meta name="description" content="MATÉOS — Maintenance et Assistance Technique des Équipements et Organes de Sécurité.">
  <title>MATÉOS — Présentation</title>
  <link rel="icon" type="image/png" href="./mateos_256.png">
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,"Segoe UI",sans-serif;color-scheme:dark;color:#edf4f8;background:#08192d}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 100% 0%,#1b4463,transparent 42%),#08192d}
    .shell{max-width:1060px;margin:auto;padding:30px clamp(20px,5vw,56px) 50px}
    .back{display:inline-flex;align-items:center;min-height:44px;color:#bed2de;text-decoration:none;font-size:14px}
    .back:hover,.back:focus-visible{color:#fff;text-decoration:underline}
    main{margin-top:clamp(35px,8vw,92px);padding:clamp(24px,5vw,54px);border:1px solid #385b74;border-top:3px solid #dba946;border-radius:16px;background:linear-gradient(145deg,#17354e,#0d2237);box-shadow:0 22px 54px #020e1a66}
    .logo{display:block;width:min(100%,670px);height:auto;border-radius:8px}
    h1{font-size:clamp(26px,4vw,42px);line-height:1.15;margin:36px 0 12px;letter-spacing:-.03em}
    .subtitle{font-size:clamp(16px,2vw,20px);line-height:1.5;color:#c1d1d9;margin:0}
    .notice{display:inline-block;margin-top:34px;padding:10px 15px;border:1px solid #b6904d;border-radius:8px;background:#4d3a223b;color:#f2d69d;font-weight:700}
    .motto{margin-top:40px;color:#e2b963;font-size:13px;font-weight:750;letter-spacing:.13em;line-height:1.7}
    footer{margin-top:26px;color:#91acbd;font-size:12px}
  </style>
</head>
<body>
  <div class="shell">
    <a class="back" href="/">← Retour à SYNÉOS</a>
    <main>
      <img class="logo" src="./mateos_logo_horizontal.png" alt="Logo MATÉOS">
      <p class="subtitle">Suite SYNÉOS</p>
      <h1>MATÉOS</h1>
      <p class="subtitle">Gestion des équipements de sécurité incendie et systèmes associés</p>
      <div class="notice">Application en préparation</div>
      <div class="motto">INVENTORIER • CONTRÔLER • PLANIFIER • SÉCURISER</div>
    </main>
    <footer>MATÉOS · Maintenance et Assistance Technique des Équipements et Organes de Sécurité</footer>
  </div>
</body>
</html>
